name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.57.0
        cache: true

    - name: Run Tests
      run: pixi run -e test test

    - name: Measure coverage with the kernels uncompiled
      if: matrix.os == 'ubuntu-latest'
      run: pixi run -e test coverage

    - name: Upload coverage reports to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ptorrijos99/scikit-bayes

  # The package installed with pip, as users install it, on the oldest and the
  # newest supported Python with the minimum and the latest dependencies.
  dependency-versions:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum versions (Python 3.10)
            os: ubuntu-latest
            python: "3.10"
            pins: numpy==1.23.5 scipy==1.9.3 scikit-learn==1.6.0 joblib==1.2.0 numba==0.58.1
          - name: latest versions (Python 3.12)
            os: ubuntu-latest
            python: "3.12"
            pins: ""
          - name: latest versions (Python 3.14)
            os: ubuntu-latest
            python: "3.14"
            pins: ""
          - name: latest versions (Python 3.13, Windows)
            os: windows-latest
            python: "3.13"
            pins: ""

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools_scm needs the tags

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}

    - name: Install
      run: |
        python -m pip install --upgrade pip
        python -m pip install ${{ matrix.pins }} . pytest pandas

    - name: Run Tests
      # From outside the source tree, so the installed package is tested
      run: |
        mkdir run && cd run
        python -m pytest -q -p no:cacheprovider --doctest-modules --pyargs skbn
